<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" role="img" aria-labelledby="title desc">
  <title id="title">Job Engine discovery and preparation</title>
  <desc id="desc">Job inputs feed normalized records. Career Truth Vault evidence and job records feed matching, followed by user-selected preparation and review. Tracking records confirmed external submissions.</desc>
  <style>
    svg { --bg:#f8f9fb; --surface:#fff; --ink:#20232c; --muted:#5d6370; --line:#dfe2e9; --accent:#5b46cb; }
    @media (prefers-color-scheme:dark) { svg { --bg:#121419; --surface:#191c23; --ink:#ecedf2; --muted:#a8adba; --line:#333743; --accent:#b1a2ff; } }
    .canvas { fill:var(--bg); }
    .box { fill:var(--surface); stroke:var(--line); }
    .flow { fill:none; stroke:var(--accent); stroke-width:1.5; }
    .arrow { fill:var(--accent); }
    text { font-family:Arial,Helvetica,sans-serif; text-anchor:middle; fill:var(--ink); font-size:20px; }
    .note { font-size:17px; fill:var(--muted); }
  </style>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path class="arrow" d="M0 0 8 4 0 8Z"/></marker></defs>
  <rect class="canvas" width="420" height="600"/>
  <rect class="box" x="24" y="24" width="174" height="86" rx="5"/>
  <text x="111" y="54">Job inputs</text>
  <text class="note" x="111" y="78">URLs · ATS feeds</text>
  <text class="note" x="111" y="99">Outlook discovery</text>
  <path class="flow" d="M111 110V141" marker-end="url(#arrow)"/>
  <rect class="box" x="24" y="144" width="174" height="86" rx="5"/>
  <text x="111" y="178">Normalized</text>
  <text x="111" y="205">job records</text>
  <rect class="box" x="222" y="144" width="174" height="86" rx="5"/>
  <text x="309" y="171">Career Truth</text>
  <text x="309" y="196">Vault</text>
  <text class="note" x="309" y="218">Approved evidence</text>
  <path class="flow" d="M111 230V250H210M309 230V250H210V277" marker-end="url(#arrow)"/>
  <rect class="box" x="24" y="280" width="372" height="72" rx="5"/>
  <text x="210" y="311">Requirement matching</text>
  <text class="note" x="210" y="335">Scores · evidence · gaps</text>
  <path class="flow" d="M210 352V393" marker-end="url(#arrow)"/>
  <rect class="box" x="24" y="396" width="372" height="74" rx="5"/>
  <text x="210" y="427">User-selected preparation</text>
  <text class="note" x="210" y="452">Drafts · résumé review · export</text>
  <path class="flow" d="M210 470V511" marker-end="url(#arrow)"/>
  <rect class="box" x="24" y="514" width="372" height="62" rx="5"/>
  <text x="210" y="541">Application tracking</text>
  <text class="note" x="210" y="563">External submission confirmed by user</text>
</svg>
